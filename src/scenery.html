<section class="scenery" aria-label="픽셀 풍경">
  <div class="scenery-titlebar">
    <span><span class="pixel-spark" aria-hidden="true">✦</span> 잠깐, 다른 풍경</span>
    <span class="scene-counter" aria-hidden="true">01 / 10</span>
  </div>
  <div class="scene-art" aria-hidden="true">
    <canvas width="640" height="360" data-scene-window></canvas>
    <div class="scene-caption"><span class="scene-label">도시의 밤</span><span>OWENCITY · PIXEL SCENES</span></div>
  </div>
  <div class="scene-controls" hidden>
    <div class="scene-choice">
      <label for="scene-select">풍경</label>
      <select id="scene-select" aria-label="배경 풍경 선택"></select>
    </div>
    <div class="scene-buttons">
      <button type="button" data-scene-prev aria-label="이전 풍경">←</button>
      <button type="button" data-scene-play aria-label="배경 정지">Ⅱ <span>정지</span></button>
      <button type="button" data-scene-next aria-label="다음 풍경">→</button>
    </div>
    <span class="scene-hint">10초마다 전환</span>
  </div>
  <div class="scene-progress" aria-hidden="true"><span></span></div>
</section>
