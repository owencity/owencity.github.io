spring:
  application:
    name: devdesk
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devdesk}
    username: ${DATABASE_USER:devdesk}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
devdesk:
  summary:
    enabled: ${AI_SUMMARY_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:}
    fallback-models: ${GEMINI_FALLBACK_MODELS:}
    model-daily-limit: ${AI_SUMMARY_MODEL_DAILY_LIMIT:500}
    daily-limit: ${AI_SUMMARY_DAILY_LIMIT:20}
    max-attempts: ${AI_SUMMARY_MAX_ATTEMPTS:3}
    batch-size: ${AI_SUMMARY_BATCH_SIZE:1}
    interval-ms: ${AI_SUMMARY_INTERVAL_MS:60000}
    max-input-chars: ${AI_SUMMARY_MAX_INPUT_CHARS:120000}
    max-output-tokens: ${AI_SUMMARY_MAX_OUTPUT_TOKENS:12000}
    request-timeout-seconds: ${AI_SUMMARY_TIMEOUT_SECONDS:90}
    source-max-bytes: 2097152
    source-max-chars: ${AI_SUMMARY_MAX_INPUT_CHARS:120000}
    source-min-chars: 200
  owner:
    username: ${OWNER_USERNAME:owner}
    password: ${OWNER_PASSWORD:}
  feed:
    enabled: ${FEED_ENABLED:true}
    interval-ms: ${FEED_INTERVAL_MS:900000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_REFRESH_TOKEN:}
    tasks-refresh-token: ${GOOGLE_TASKS_REFRESH_TOKEN:}
    calendar-id: ${GOOGLE_CALENDAR_ID:primary}
    write-enabled: ${GOOGLE_CALENDAR_WRITE_ENABLED:false}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    scheduled-enabled: ${DIGEST_SCHEDULED_ENABLED:false}
    cron: ${DIGEST_CRON:0 0 8 * * *}
    slack-webhook: ${SLACK_WEBHOOK_URL:}
    email-from: ${EMAIL_FROM:}
    email-to: ${EMAIL_TO:}
  tasks:
    followup-channel: ${TASK_FOLLOWUP_CHANNEL:}
